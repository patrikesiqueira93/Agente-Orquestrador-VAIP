name: VAIP Seguranca e Politicas

on:
  schedule:
    # 22:05 em America/Sao_Paulo (UTC-3, sem horario de verao desde 2019) = 01:05 UTC
    - cron: "5 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaip-daily
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  TZ: America/Sao_Paulo

jobs:
  seguranca-politicas:
    name: Seguranca e monitor de politicas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout com historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Varredura de segredos no historico
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Monitor de politicas das plataformas
        id: policy
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_POLITICAS_WEBHOOK_URL }}
        run: python scripts/check_platform_policy.py --notify

      - name: Varredura SecOps do projeto
        id: secops
        continue-on-error: true
        env:
          DISCORD_SECURITY_WEBHOOK_URL: ${{ secrets.DISCORD_SEGURANCA_WEBHOOK_URL }}
        run: python scripts/secops_guard.py

      - name: Commitar estado do ledger
        if: always()
        run: |
          git config user.name "vaip-bot"
          git config user.email "vaip-bot@users.noreply.github.com"

          if [ ! -d ledger ]; then
            echo "Pasta ledger ausente. Nada a commitar."
            exit 0
          fi

          git add ledger

          if git diff --staged --quiet; then
            echo "Sem alteracoes no ledger."
            exit 0
          fi

          git commit -m "chore: estado de seguranca e politicas $(date -u +%Y-%m-%d)"

          if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
            echo "::error::Rebase falhou no ledger."
            git rebase --abort || true
            exit 1
          fi

          git push

      - name: Resumo da execucao
        if: always()
        run: |
          echo "### Resultado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gitleaks: ${{ steps.gitleaks.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Politicas: ${{ steps.policy.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SecOps: ${{ steps.secops.outcome }}" >> "$GITHUB_STEP_SUMMARY"
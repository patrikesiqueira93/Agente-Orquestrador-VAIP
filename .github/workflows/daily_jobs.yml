name: VAIP Daily Job Hunter (Nuvem 100% Autonoma)

on:
  schedule:
    # 20:30 UTC = 17:30 Horário de Brasília (BRT) todos os dias
    - cron: '30 20 * * *'
  workflow_dispatch: # Permite disparar manualmente a qualquer momento pelo GitHub

permissions:
  contents: write

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar VAIP Hunter e Disparar para Discord (com Anexo)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/daily_runner.py

      - name: Versionar Relatório e Estado no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ ledger/state.json
          git commit -m "chore(auto): relatorio de vagas $(date +'%Y-%m-%d') [skip ci]" || echo "Sem alteracoes para commitar"
          git push || echo "Aviso: Nao foi possivel dar push (verificar permissoes de escrita do workflow)"

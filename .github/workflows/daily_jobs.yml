name: VAIP Daily Jobs

on:
  schedule:
    # 17:30 em America/Sao_Paulo (UTC-3, sem horario de verao desde 2019)
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaip-daily
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  TZ: America/Sao_Paulo

jobs:
  daily:
    name: Execucao diaria
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GUPY_USER_EMAIL: ${{ secrets.GUPY_USER_EMAIL }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      KWAI_ACCESS_TOKEN: ${{ secrets.KWAI_ACCESS_TOKEN }}

    steps:
      - name: Checkout com historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "Sem requirements.txt: projeto usa apenas a biblioteca padrao."
          fi

      - name: Criar .env a partir dos segredos
        run: |
          : > .env
          for var in GEMINI_API_KEY DISCORD_WEBHOOK_URL TELEGRAM_BOT_TOKEN \
                     TELEGRAM_CHAT_ID GUPY_USER_EMAIL TIKTOK_ACCESS_TOKEN \
                     KWAI_ACCESS_TOKEN; do
            printf '%s=%s\n' "$var" "${!var}" >> .env
          done
          echo ".env gerado com $(wc -l < .env) variaveis."

      - name: Varredura de segredos no historico
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Monitor de politicas das plataformas
        id: policy
        continue-on-error: true
        run: python scripts/check_platform_policy.py --notify

      - name: Pipeline diario
        run: python scripts/daily_runner.py

      - name: Commitar resultados
        run: |
          git config user.name "vaip-bot"
          git config user.email "vaip-bot@users.noreply.github.com"
          git add data ledger
          if git diff --staged --quiet; then
            echo "Sem alteracoes para commitar."
            exit 0
          fi
          git commit -m "chore: execucao diaria $(date -u +%Y-%m-%d)"
          git push

      - name: Resumo da execucao
        if: always()
        run: |
          echo "### Resultado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gitleaks: ${{ steps.gitleaks.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Politicas: ${{ steps.policy.outcome }}" >> "$GITHUB_STEP_SUMMARY"